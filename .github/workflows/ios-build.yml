
name: Build BCT Calculator for iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.0.5

      - name: Build iOS archive
        run: flet build ipa --build-number ${{ github.run_number }}

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH=$(find build/ipa -type d \
            -path '*/Products/Applications/*.app' \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Could not find the compiled iOS app."
            find build/ipa -maxdepth 5 -print
            exit 1
          fi

          mkdir -p unsigned/Payload
          cp -R "$APP_PATH" unsigned/Payload/

          cd unsigned
          zip -qry "$GITHUB_WORKSPACE/BCT-Calculator.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BCT-Calculator-iOS
          path: BCT-Calculator.ipa
          if-no-files-found: error
